name: CI

# 第一阶段最简 CI：push/PR 自动跑单元测试（逐文件，跨版本稳健）＋ 密钥扫描。
# Eval 门禁后置（报告 v1.1）：评测集稳定前作为发版前手动命令，不在此卡 PR。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Unit tests
        run: |
          rc=0
          for f in tests/test_*.py; do
            echo "===== $f ====="
            python "$f" || rc=1
          done
          exit $rc

      - name: Secret scan
        run: python scripts/bin/secret_scan.py
