name: Publish to npm

# 打 tag（v*）时自动发布到 npm；GitHub 仍是开发主场，npm 是分发镜像。
# 前置：仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN
# （npmjs.com → Access Tokens → Granular/Automation token，建议 Automation 免 2FA）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      - name: Publish (skip if version already on npm)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already exists on npm — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
